version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skill2hire-web
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - NODE_ENV=production
      - NEXT_PUBLIC_APP_URL=http://localhost:9000
      - JWT_SECRET=skill2hire_super_secret_session_token_2026
      - NEXTAUTH_SECRET=skill2hire_auth_master_key_2026
    restart: unless-stopped
    volumes:
      - ./data:/app/data

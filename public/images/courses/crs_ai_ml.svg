<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0b36"/>
      <stop offset="50%" stop-color="#3b1154"/>
      <stop offset="100%" stop-color="#140426"/>
    </linearGradient>
    <linearGradient id="aiMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glowAi" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridAi" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ec4899" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="600" height="340" fill="url(#bgGradAi)"/>
  <rect width="600" height="340" fill="url(#gridAi)"/>
  <circle cx="150" cy="170" r="120" fill="#a855f7" fill-opacity="0.2" filter="url(#glowAi)"/>
  <circle cx="450" cy="170" r="120" fill="#f43f5e" fill-opacity="0.15" filter="url(#glowAi)"/>
  <rect x="20" y="20" width="560" height="300" rx="16" fill="none" stroke="#ec4899" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Neural Network Mesh Vector -->
  <g transform="translate(80, 75)">
    <!-- Layer 1 Inputs -->
    <circle cx="20" cy="30" r="8" fill="#ec4899"/>
    <circle cx="20" cy="65" r="8" fill="#ec4899"/>
    <circle cx="20" cy="100" r="8" fill="#ec4899"/>
    <circle cx="20" cy="135" r="8" fill="#ec4899"/>

    <!-- Layer 2 Hidden -->
    <circle cx="75" cy="45" r="10" fill="#a855f7" filter="url(#glowAi)"/>
    <circle cx="75" cy="85" r="10" fill="#a855f7" filter="url(#glowAi)"/>
    <circle cx="75" cy="125" r="10" fill="#a855f7" filter="url(#glowAi)"/>

    <!-- Layer 3 Outputs -->
    <circle cx="130" cy="65" r="12" fill="#38bdf8" filter="url(#glowAi)"/>
    <circle cx="130" cy="105" r="12" fill="#38bdf8" filter="url(#glowAi)"/>

    <!-- Connecting Synaptic Lines -->
    <g stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.4">
      <line x1="20" y1="30" x2="75" y2="45"/>
      <line x1="20" y1="30" x2="75" y2="85"/>
      <line x1="20" y1="65" x2="75" y2="45"/>
      <line x1="20" y1="65" x2="75" y2="85"/>
      <line x1="20" y1="65" x2="75" y2="125"/>
      <line x1="20" y1="100" x2="75" y2="85"/>
      <line x1="20" y1="100" x2="75" y2="125"/>
      <line x1="20" y1="135" x2="75" y2="85"/>
      <line x1="20" y1="135" x2="75" y2="125"/>
      <line x1="75" y1="45" x2="130" y2="65"/>
      <line x1="75" y1="85" x2="130" y2="65"/>
      <line x1="75" y1="85" x2="130" y2="105"/>
      <line x1="75" y1="125" x2="130" y2="105"/>
    </g>
  </g>

  <!-- Typography & Details (Right Side) -->
  <g transform="translate(270, 70)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#a855f7" fill-opacity="0.15" stroke="#ec4899" stroke-width="1" stroke-opacity="0.4"/>
    <text x="70" y="17" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">ARTIFICIAL INTEL</text>

    <text x="0" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Applied ML &amp;</text>
    <text x="0" y="98" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">GenAI Systems</text>

    <text x="0" y="135" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">PyTorch • LLMs • RAG • Transformers</text>

    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="65" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="32" y="15" fill="#f472b6" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">PyTorch</text>

      <rect x="73" y="0" width="60" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="103" y="15" fill="#a855f7" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">LLMs</text>

      <rect x="141" y="0" width="75" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="178" y="15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">GenAI RAG</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradCloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b36"/>
      <stop offset="50%" stop-color="#142c54"/>
      <stop offset="100%" stop-color="#08142b"/>
    </linearGradient>
    <linearGradient id="awsOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cloudSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glowCloud" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridCloud" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#38bdf8" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="600" height="340" fill="url(#bgGradCloud)"/>
  <rect width="600" height="340" fill="url(#gridCloud)"/>
  <circle cx="150" cy="170" r="120" fill="#0284c7" fill-opacity="0.2" filter="url(#glowCloud)"/>
  <circle cx="450" cy="170" r="120" fill="#f59e0b" fill-opacity="0.12" filter="url(#glowCloud)"/>
  <rect x="20" y="20" width="560" height="300" rx="16" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Cloud Infrastructure Vector -->
  <g transform="translate(80, 75)">
    <!-- Cloud Silhouette -->
    <path d="M 40 100 L 120 100 C 135 100 145 88 145 75 C 145 62 135 52 122 52 C 120 32 105 18 85 18 C 68 18 54 28 48 42 C 45 40 40 40 35 45 C 22 48 15 60 15 72 C 15 88 28 100 40 100 Z" fill="#0284c7" fill-opacity="0.3" stroke="url(#cloudSky)" stroke-width="2.5" filter="url(#glowCloud)"/>

    <!-- Server Node / AWS smile arch -->
    <path d="M 45 115 C 80 135 90 135 125 115" fill="none" stroke="url(#awsOrange)" stroke-width="4" stroke-linecap="round"/>
    <polygon points="128,114 122,124 133,122" fill="#f59e0b"/>

    <text x="85" y="70" fill="#ffffff" font-family="monospace" font-size="14" font-weight="900" text-anchor="middle">AWS</text>
  </g>

  <!-- Typography & Details (Right Side) -->
  <g transform="translate(270, 70)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-width="1" stroke-opacity="0.4"/>
    <text x="70" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">CLOUD &amp; DEVOPS</text>

    <text x="0" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Cloud Fundamentals</text>
    <text x="0" y="98" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">(AWS Architecture)</text>

    <text x="0" y="135" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">EC2 • S3 • IAM • VPC • Serverless Lambda</text>

    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="60" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="30" y="15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">EC2</text>

      <rect x="68" y="0" width="60" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="98" y="15" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">S3</text>

      <rect x="136" y="0" width="75" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="173" y="15" fill="#34d399" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Lambda</text>
    </g>
  </g>
</svg>

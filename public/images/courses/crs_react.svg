<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradReact" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f33"/>
      <stop offset="50%" stop-color="#082b47"/>
      <stop offset="100%" stop-color="#021424"/>
    </linearGradient>
    <linearGradient id="reactCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#61dafb"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>
    <filter id="glowReact" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridReact" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#61dafb" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="600" height="340" fill="url(#bgGradReact)"/>
  <rect width="600" height="340" fill="url(#gridReact)"/>
  <circle cx="150" cy="170" r="120" fill="#00b4d8" fill-opacity="0.2" filter="url(#glowReact)"/>
  <circle cx="450" cy="170" r="120" fill="#61dafb" fill-opacity="0.12" filter="url(#glowReact)"/>
  <rect x="20" y="20" width="560" height="300" rx="16" fill="none" stroke="#61dafb" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- React Luminous Atom Vector -->
  <g transform="translate(85, 75)">
    <!-- Central Nucleus -->
    <circle cx="75" cy="75" r="14" fill="#61dafb" filter="url(#glowReact)"/>
    <circle cx="75" cy="75" r="7" fill="#ffffff"/>

    <!-- Orbital Ring 1 -->
    <ellipse cx="75" cy="75" rx="65" ry="24" fill="none" stroke="#61dafb" stroke-width="3" filter="url(#glowReact)"/>
    <!-- Orbital Ring 2 (Rotated 60 deg) -->
    <ellipse cx="75" cy="75" rx="65" ry="24" fill="none" stroke="#61dafb" stroke-width="3" transform="rotate(60 75 75)" filter="url(#glowReact)"/>
    <!-- Orbital Ring 3 (Rotated 120 deg) -->
    <ellipse cx="75" cy="75" rx="65" ry="24" fill="none" stroke="#61dafb" stroke-width="3" transform="rotate(120 75 75)" filter="url(#glowReact)"/>
  </g>

  <!-- Typography & Details (Right Side) -->
  <g transform="translate(270, 70)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#00b4d8" fill-opacity="0.15" stroke="#61dafb" stroke-width="1" stroke-opacity="0.4"/>
    <text x="70" y="17" fill="#61dafb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">FRONTEND MASTERY</text>

    <text x="0" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Modern React &amp;</text>
    <text x="0" y="98" fill="#61dafb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">Frontend Engineering</text>

    <text x="0" y="135" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Hooks • Next.js App Router • Tailwind • Redux</text>

    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="60" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="30" y="15" fill="#61dafb" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Hooks</text>

      <rect x="68" y="0" width="70" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="103" y="15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Next.js</text>

      <rect x="146" y="0" width="75" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="183" y="15" fill="#34d399" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Tailwind</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradJava" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241009"/>
      <stop offset="50%" stop-color="#3b1d11"/>
      <stop offset="100%" stop-color="#190a05"/>
    </linearGradient>
    <linearGradient id="javaOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="javaRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <filter id="glowJava" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridJava" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f97316" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <rect width="600" height="340" fill="url(#bgGradJava)"/>
  <rect width="600" height="340" fill="url(#gridJava)"/>
  <circle cx="150" cy="170" r="120" fill="#ea580c" fill-opacity="0.2" filter="url(#glowJava)"/>
  <circle cx="450" cy="170" r="120" fill="#f59e0b" fill-opacity="0.12" filter="url(#glowJava)"/>
  <rect x="20" y="20" width="560" height="300" rx="16" fill="none" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Java Steam Cup Vector Icon -->
  <g transform="translate(90, 75)">
    <!-- Steam Curves -->
    <path d="M 45 40 Q 60 20 45 5 Q 35 18 50 35" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 65 38 Q 80 15 65 0 Q 55 15 70 32" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M 85 40 Q 100 20 85 5 Q 75 18 90 35" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

    <!-- Cup Body -->
    <path d="M 30 50 L 100 50 C 100 95 85 110 65 110 C 45 110 30 95 30 50 Z" fill="url(#javaOrange)" filter="url(#glowJava)"/>
    <path d="M 35 55 L 95 55 C 95 90 82 105 65 105 C 48 105 35 90 35 55 Z" fill="#241009"/>

    <!-- Cup Handle -->
    <path d="M 95 60 C 115 60 115 90 95 90" fill="none" stroke="url(#javaOrange)" stroke-width="6" stroke-linecap="round"/>

    <!-- Base Saucer -->
    <path d="M 20 120 C 65 135 75 135 110 120" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Typography & Details (Right Side) -->
  <g transform="translate(270, 70)">
    <rect x="0" y="0" width="130" height="26" rx="13" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-width="1" stroke-opacity="0.4"/>
    <text x="65" y="17" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">ENTERPRISE</text>

    <text x="0" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Java Enterprise &amp;</text>
    <text x="0" y="98" fill="#fb923c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">Core Internals</text>

    <text x="0" y="135" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">JVM • Multithreading • Collections • Spring</text>

    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="60" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="30" y="15" fill="#fb923c" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">JVM</text>

      <rect x="68" y="0" width="75" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="105" y="15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Threads</text>

      <rect x="151" y="0" width="75" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="188" y="15" fill="#34d399" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Spring</text>
    </g>
  </g>
</svg>

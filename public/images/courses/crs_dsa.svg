<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradDsa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1136"/>
      <stop offset="50%" stop-color="#2d124d"/>
      <stop offset="100%" stop-color="#120724"/>
    </linearGradient>
    <linearGradient id="dsaPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="dsaPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#be185d"/>
    </linearGradient>
    <filter id="glowDsa" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridDsa" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#c084fc" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="600" height="340" fill="url(#bgGradDsa)"/>
  <rect width="600" height="340" fill="url(#gridDsa)"/>
  <circle cx="150" cy="170" r="120" fill="#a855f7" fill-opacity="0.2" filter="url(#glowDsa)"/>
  <circle cx="450" cy="170" r="120" fill="#ec4899" fill-opacity="0.15" filter="url(#glowDsa)"/>
  <rect x="20" y="20" width="560" height="300" rx="16" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Binary Tree & Graph Nodes Vector -->
  <g transform="translate(85, 75)">
    <!-- Tree Connecting Edges -->
    <line x1="75" y1="20" x2="35" y2="70" stroke="#a855f7" stroke-width="2.5"/>
    <line x1="75" y1="20" x2="115" y2="70" stroke="#ec4899" stroke-width="2.5"/>
    <line x1="35" y1="70" x2="15" y2="120" stroke="#a855f7" stroke-width="2.5"/>
    <line x1="35" y1="70" x2="55" y2="120" stroke="#a855f7" stroke-width="2.5"/>
    <line x1="115" y1="70" x2="95" y2="120" stroke="#ec4899" stroke-width="2.5"/>
    <line x1="115" y1="70" x2="135" y2="120" stroke="#ec4899" stroke-width="2.5"/>

    <!-- Root Node -->
    <circle cx="75" cy="20" r="18" fill="url(#dsaPurple)" filter="url(#glowDsa)"/>
    <circle cx="75" cy="20" r="18" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="75" y="25" fill="#ffffff" font-family="monospace" font-size="12" font-weight="900" text-anchor="middle">O(1)</text>

    <!-- Level 1 Nodes -->
    <circle cx="35" cy="70" r="15" fill="#7e22ce" stroke="#c084fc" stroke-width="2"/>
    <text x="35" y="74" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">L</text>

    <circle cx="115" cy="70" r="15" fill="#be185d" stroke="#f472b6" stroke-width="2"/>
    <text x="115" y="74" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">R</text>

    <!-- Level 2 Nodes -->
    <circle cx="15" cy="120" r="12" fill="#581c87"/>
    <circle cx="55" cy="120" r="12" fill="#581c87"/>
    <circle cx="95" cy="120" r="12" fill="#831843"/>
    <circle cx="135" cy="120" r="12" fill="#831843"/>
  </g>

  <!-- Typography & Details (Right Side) -->
  <g transform="translate(270, 70)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-width="1" stroke-opacity="0.4"/>
    <text x="70" y="17" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">DATA STRUCTURES</text>

    <text x="0" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Algorithms &amp;</text>
    <text x="0" y="98" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">DSA Masterclass</text>

    <text x="0" y="135" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Trees • Graphs • DP • Big-O Complexity</text>

    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="60" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="30" y="15" fill="#c084fc" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Trees</text>

      <rect x="68" y="0" width="70" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="103" y="15" fill="#ec4899" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Dynamic</text>

      <rect x="146" y="0" width="75" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="183" y="15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Graphs</text>
    </g>
  </g>
</svg>

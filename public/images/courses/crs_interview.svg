<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradInt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="intCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="intEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glowInt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridInt" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#06b6d4" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="600" height="340" fill="url(#bgGradInt)"/>
  <rect width="600" height="340" fill="url(#gridInt)"/>
  <circle cx="150" cy="170" r="120" fill="#0891b2" fill-opacity="0.2" filter="url(#glowInt)"/>
  <circle cx="450" cy="170" r="120" fill="#10b981" fill-opacity="0.12" filter="url(#glowInt)"/>
  <rect x="20" y="20" width="560" height="300" rx="16" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Technical Interview & Microphone/Whiteboard Vector -->
  <g transform="translate(85, 80)">
    <!-- Whiteboard Frame -->
    <rect x="15" y="15" width="120" height="90" rx="10" fill="#1e293b" stroke="#06b6d4" stroke-width="2.5" filter="url(#glowInt)"/>
    <rect x="25" y="25" width="100" height="70" rx="6" fill="#0f172a"/>

    <!-- Code Line Simulators -->
    <line x1="35" y1="40" x2="70" y2="40" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="35" y1="55" x2="105" y2="55" stroke="#34d399" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="70" x2="85" y2="70" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

    <!-- Candidate Check Badge -->
    <circle cx="115" cy="115" r="18" fill="url(#intEmerald)" filter="url(#glowInt)"/>
    <polyline points="107,115 113,121 123,109" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography & Details (Right Side) -->
  <g transform="translate(270, 70)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#0891b2" fill-opacity="0.15" stroke="#0891b2" stroke-width="1" stroke-opacity="0.4"/>
    <text x="70" y="17" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">CAREER ACCELERATOR</text>

    <text x="0" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Technical Interview &amp;</text>
    <text x="0" y="98" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">System Design Prep</text>

    <text x="0" y="135" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Live Mock Rounds • STAR Method • Architecture</text>

    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="70" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="35" y="15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Whiteboard</text>

      <rect x="78" y="0" width="60" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="108" y="15" fill="#34d399" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">STAR</text>

      <rect x="146" y="0" width="75" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="183" y="15" fill="#fbbf24" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">SysDesign</text>
    </g>
  </g>
</svg>

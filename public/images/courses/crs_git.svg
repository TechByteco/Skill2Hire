<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradGit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241014"/>
      <stop offset="50%" stop-color="#3b171f"/>
      <stop offset="100%" stop-color="#19090d"/>
    </linearGradient>
    <linearGradient id="gitCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="gitOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glowGit" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridGit" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#f43f5e" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="600" height="340" fill="url(#bgGradGit)"/>
  <rect width="600" height="340" fill="url(#gridGit)"/>
  <circle cx="150" cy="170" r="120" fill="#f43f5e" fill-opacity="0.2" filter="url(#glowGit)"/>
  <circle cx="450" cy="170" r="120" fill="#f97316" fill-opacity="0.12" filter="url(#glowGit)"/>
  <rect x="20" y="20" width="560" height="300" rx="16" fill="none" stroke="#f43f5e" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- Git Branching Nodes Vector -->
  <g transform="translate(85, 75)">
    <!-- Main Branch Line -->
    <line x1="45" y1="20" x2="45" y2="140" stroke="#f43f5e" stroke-width="4"/>
    <!-- Feature Branch Arc -->
    <path d="M 45 60 C 95 60 105 75 105 95 L 105 115 C 105 130 90 140 45 140" fill="none" stroke="#f97316" stroke-width="3.5" stroke-dasharray="2,2"/>

    <!-- Commits -->
    <circle cx="45" cy="20" r="12" fill="url(#gitCrimson)" filter="url(#glowGit)"/>
    <circle cx="45" cy="20" r="6" fill="#ffffff"/>

    <circle cx="45" cy="60" r="10" fill="#e11d48"/>
    <circle cx="45" cy="60" r="5" fill="#ffffff"/>

    <circle cx="105" cy="95" r="10" fill="#f97316"/>
    <circle cx="105" cy="95" r="5" fill="#ffffff"/>

    <circle cx="45" cy="140" r="12" fill="url(#gitCrimson)" filter="url(#glowGit)"/>
    <circle cx="45" cy="140" r="6" fill="#34d399"/>
  </g>

  <!-- Typography & Details (Right Side) -->
  <g transform="translate(270, 70)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#f43f5e" fill-opacity="0.15" stroke="#f43f5e" stroke-width="1" stroke-opacity="0.4"/>
    <text x="70" y="17" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">VERSION CONTROL</text>

    <text x="0" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Git &amp; GitHub</text>
    <text x="0" y="98" fill="#fb7185" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">Collaboration Pro</text>

    <text x="0" y="135" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">Branching • Rebasing • Pull Requests • CI/CD</text>

    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="65" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="32" y="15" fill="#fb7185" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Branches</text>

      <rect x="73" y="0" width="65" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="105" y="15" fill="#f97316" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Rebase</text>

      <rect x="146" y="0" width="75" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="183" y="15" fill="#34d399" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">PR Review</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradOop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141a29"/>
      <stop offset="50%" stop-color="#1f293d"/>
      <stop offset="100%" stop-color="#0f1420"/>
    </linearGradient>
    <linearGradient id="oopViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glowOop" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <pattern id="gridOop" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#818cf8" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="600" height="340" fill="url(#bgGradOop)"/>
  <rect width="600" height="340" fill="url(#gridOop)"/>
  <circle cx="150" cy="170" r="120" fill="#6366f1" fill-opacity="0.2" filter="url(#glowOop)"/>
  <circle cx="450" cy="170" r="120" fill="#38bdf8" fill-opacity="0.12" filter="url(#glowOop)"/>
  <rect x="20" y="20" width="560" height="300" rx="16" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.25"/>

  <!-- UML Class Architecture Diagrams Vector -->
  <g transform="translate(85, 80)">
    <!-- Base Interface Box -->
    <rect x="35" y="10" width="90" height="45" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" filter="url(#glowOop)"/>
    <text x="80" y="28" fill="#c7d2fe" font-family="monospace" font-size="9" font-weight="bold" text-anchor="middle">&lt;&lt;interface&gt;&gt;</text>
    <text x="80" y="44" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">Service</text>

    <!-- Inheritance Arrow -->
    <line x1="80" y1="55" x2="80" y2="85" stroke="#818cf8" stroke-width="2" stroke-dasharray="3,3"/>
    <polygon points="80,55 75,65 85,65" fill="#818cf8"/>

    <!-- Derived Class 1 -->
    <rect x="10" y="85" width="65" height="45" rx="6" fill="#312e81" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="42" y="112" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Auth</text>

    <!-- Derived Class 2 -->
    <rect x="85" y="85" width="65" height="45" rx="6" fill="#312e81" stroke="#a5b4fc" stroke-width="1.5"/>
    <text x="117" y="112" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Payment</text>
  </g>

  <!-- Typography & Details (Right Side) -->
  <g transform="translate(270, 70)">
    <rect x="0" y="0" width="140" height="26" rx="13" fill="#6366f1" fill-opacity="0.15" stroke="#6366f1" stroke-width="1" stroke-opacity="0.4"/>
    <text x="70" y="17" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">SOFTWARE DESIGN</text>

    <text x="0" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5">Object-Oriented &amp;</text>
    <text x="0" y="98" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="-0.5">Clean Architecture</text>

    <text x="0" y="135" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">SOLID • Design Patterns • Refactoring • UML</text>

    <g transform="translate(0, 155)">
      <rect x="0" y="0" width="60" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="30" y="15" fill="#a5b4fc" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">SOLID</text>

      <rect x="68" y="0" width="70" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="103" y="15" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Factory</text>

      <rect x="146" y="0" width="75" height="22" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="183" y="15" fill="#34d399" font-family="monospace" font-size="11" font-weight="600" text-anchor="middle">Observer</text>
    </g>
  </g>
</svg>

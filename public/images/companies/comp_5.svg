<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="feGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="feGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="#1c1917"/>
  <!-- Sharp Exponential Geometric FinEdge Diamond/Bar Crest -->
  <rect x="42" y="110" width="22" height="45" rx="6" fill="#78716c"/>
  <rect x="74" y="85" width="22" height="70" rx="6" fill="#d97706"/>
  <rect x="106" y="60" width="22" height="95" rx="6" fill="url(#feGrad)" filter="url(#feGlow)"/>
  <rect x="138" y="35" width="22" height="120" rx="6" fill="#fbbf24" filter="url(#feGlow)"/>
  <!-- Trend Arrow -->
  <polyline points="40,115 80,80 115,65 155,30" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="160,25 145,28 155,42" fill="#ffffff"/>
</svg>

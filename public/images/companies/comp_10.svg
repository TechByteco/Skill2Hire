<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="alGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="alGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="#04221d"/>
  <!-- Apex Chevron Vector -->
  <polygon points="100,32 165,100 135,100 100,64 65,100 35,100" fill="url(#alGrad)" filter="url(#alGlow)"/>
  <polygon points="100,82 165,150 135,150 100,114 65,150 35,150" fill="#2dd4bf"/>
  <circle cx="100" cy="162" r="6" fill="#5eead4"/>
</svg>

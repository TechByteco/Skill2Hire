<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="innoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="innoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="#06221c"/>
  <!-- AI Node Network Diamond -->
  <polygon points="100,28 172,100 100,172 28,100" fill="none" stroke="url(#innoGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#innoGlow)"/>
  <!-- Central Spark / Nodes -->
  <line x1="60" y1="100" x2="140" y2="100" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="60" x2="100" y2="140" stroke="#34d399" stroke-width="5" stroke-linecap="round"/>
  <circle cx="100" cy="100" r="14" fill="#ffffff"/>
  <circle cx="60" cy="100" r="7" fill="#10b981"/>
  <circle cx="140" cy="100" r="7" fill="#10b981"/>
  <circle cx="100" cy="60" r="7" fill="#10b981"/>
  <circle cx="100" cy="140" r="7" fill="#10b981"/>
</svg>

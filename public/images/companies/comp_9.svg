<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bwGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="bwGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="#0d1527"/>
  <!-- Audio/Data Wave Bars -->
  <rect x="35" y="85" width="16" height="30" rx="8" fill="#38bdf8"/>
  <rect x="60" y="60" width="16" height="80" rx="8" fill="#60a5fa"/>
  <rect x="85" y="35" width="16" height="130" rx="8" fill="url(#bwGrad)" filter="url(#bwGlow)"/>
  <rect x="110" y="55" width="16" height="90" rx="8" fill="#818cf8"/>
  <rect x="135" y="75" width="16" height="50" rx="8" fill="#a78bfa"/>
  <rect x="160" y="90" width="16" height="20" rx="8" fill="#c084fc"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="dsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="dsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="#170f2b"/>
  <!-- Concentric Spherical Data Rings -->
  <circle cx="100" cy="100" r="65" fill="none" stroke="url(#dsGrad)" stroke-width="6" stroke-dasharray="8,6" filter="url(#dsGlow)"/>
  <ellipse cx="100" cy="100" rx="65" ry="26" fill="none" stroke="#a78bfa" stroke-width="5" transform="rotate(-30 100 100)"/>
  <ellipse cx="100" cy="100" rx="65" ry="26" fill="none" stroke="#c4b5fd" stroke-width="4" transform="rotate(30 100 100)"/>
  <circle cx="100" cy="100" r="16" fill="#ffffff" filter="url(#dsGlow)"/>
</svg>

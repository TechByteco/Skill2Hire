<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="tnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="tnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="44" fill="#0f172a"/>
  <!-- Hexagon Star Tech Vector -->
  <polygon points="100,30 160,65 160,135 100,170 40,135 40,65" fill="none" stroke="url(#tnGrad)" stroke-width="8" stroke-linejoin="round" filter="url(#tnGlow)"/>
  <!-- Central T Emblem -->
  <path d="M 68 75 L 132 75 M 100 75 L 100 135" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <circle cx="100" cy="148" r="6" fill="#60a5fa"/>
</svg>
